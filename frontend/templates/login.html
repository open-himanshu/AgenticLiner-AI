<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgenticLiner Event Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-primary: #1E3A8A;
            --brand-accent: #3b82f6;
        }
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1E3A8A 0%, #1e40af 100%);
            color: #ffffff;
            padding: 32px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="login-card">
                <div class="login-header">
                    <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                        <span class="fs-2">🚀</span>
                        <h3 class="fw-bold mb-0">AgenticLiner</h3>
                    </div>
                    <p class="small text-white-50 mb-0">College Event Planning & Operations Platform</p>
                    <span class="badge bg-light text-dark mt-2" style="font-size: 0.7rem;">Galgotias University SparkX 3.0</span>
                </div>

                <div class="p-4 p-sm-5">
                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center small py-2 mb-3" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <div>{{ error }}</div>
                    </div>
                    {% endif %}

                    {% if request.query_params.get('logged_out') %}
                    <div class="alert alert-success d-flex align-items-center small py-2 mb-3" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <div>You have been safely logged out.</div>
                    </div>
                    {% endif %}

                    <form action="/login" method="POST">
                        <input type="hidden" name="next" value="{{ next or '' }}">

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">Campus Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@galgotias.edu" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center text-muted small">
                        <span>Protected by <b>Kavach Safety & Role-Based Access</b></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
