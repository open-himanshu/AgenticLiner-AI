<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AgenticLiner Event Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-primary: #1E3A8A;
            --brand-accent: #3b82f6;
        }
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            overflow: hidden;
        }
        .signup-header {
            background: linear-gradient(135deg, #1E3A8A 0%, #1e40af 100%);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="signup-card my-3">
                <div class="signup-header">
                    <div class="d-flex justify-content-center align-items-center gap-2 mb-1">
                        <span class="fs-2">🚀</span>
                        <h3 class="fw-bold mb-0">Create Campus Account</h3>
                    </div>
                    <p class="small text-white-50 mb-0">Select your role and department to get personalized access</p>
                    <span class="badge bg-light text-dark mt-2" style="font-size: 0.7rem;">Galgotias University SparkX 3.0</span>
                </div>

                <div class="p-4 p-sm-5">
                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center small py-2 mb-3" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <div>{{ error }}</div>
                    </div>
                    {% endif %}

                    <form action="/signup" method="POST">
                        <div class="mb-3">
                            <label for="full_name" class="form-label small fw-semibold text-secondary">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ form_data.get('full_name', '') }}" placeholder="Prof. / Dr. / Student Name" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold text-secondary">Campus Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" value="{{ form_data.get('email', '') }}" placeholder="yourname@galgotias.edu" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-sm-6">
                                <label for="role" class="form-label small fw-semibold text-secondary">Role / Account Type</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="organiser" {% if form_data.get('role') == 'organiser' or not form_data.get('role') %}selected{% endif %}>Organiser (Faculty/Club)</option>
                                    <option value="supervisor" {% if form_data.get('role') == 'supervisor' %}selected{% endif %}>Supervisor (Dean / Admin)</option>
                                    <option value="participant" {% if form_data.get('role') == 'participant' %}selected{% endif %}>Participant (Student)</option>
                                    <option value="data_manager" {% if form_data.get('role') == 'data_manager' %}selected{% endif %}>Data Manager (CSV Ops)</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label for="department" class="form-label small fw-semibold text-secondary">Department</label>
                                <select class="form-select" id="department" name="department" required>
                                    <option value="School of AI" selected>School of AI</option>
                                    <option value="Computer Science (CSE)">Computer Science (CSE)</option>
                                    <option value="Data Science & ML">Data Science & ML</option>
                                    <option value="Dean Student Welfare">Dean Student Welfare</option>
                                    <option value="Technojam Club">Technojam Club</option>
                                    <option value="IEEE Student Branch">IEEE Student Branch</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-sm-6">
                                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="confirm_password" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-person-check-fill me-1"></i> Register & Enter Dashboard
                        </button>

                        <div class="text-center small">
                            <span class="text-muted">Already have an account?</span>
                            <a href="/login" class="fw-bold text-decoration-none ms-1">Sign In</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
