<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - AgenticLiner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-primary: #1E3A8A;
            --brand-accent: #3b82f6;
        }
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #1E3A8A 0%, #1e40af 100%);
            color: #ffffff;
            padding: 28px 24px;
            text-align: center;
        }
        .strength-bar {
            height: 6px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 d-flex justify-content-center">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                        <span class="fs-2">🔒</span>
                        <h3 class="fw-bold mb-0">Set New Password</h3>
                    </div>
                    <p class="small text-white-50 mb-0">For {{ email }}</p>
                </div>

                <div class="p-4 p-sm-5">
                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center small py-2 mb-3" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                        <div>{{ error }}</div>
                    </div>
                    {% endif %}

                    <form action="/reset-password" method="POST" id="resetForm">
                        <input type="hidden" name="email" value="{{ email }}">

                        <div class="mb-3">
                            <label for="new_password" class="form-label small fw-semibold text-secondary">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="••••••••" required autofocus oninput="checkStrength(this.value)">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="progress mt-2" style="height: 6px;">
                                <div id="strengthBar" class="progress-bar bg-danger" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-1">
                                <span id="strengthText" class="small text-muted" style="font-size: 0.75rem;">Password Strength: None</span>
                            </div>
                        </div>

                        <!-- Policy Checklist -->
                        <div class="bg-light p-3 rounded mb-3 border small">
                            <div class="fw-semibold text-secondary mb-1">Password Requirements:</div>
                            <div id="req-len" class="text-danger"><i class="bi bi-x-circle me-1"></i> Minimum 8 characters</div>
                            <div id="req-up" class="text-danger"><i class="bi bi-x-circle me-1"></i> At least 1 uppercase letter (A-Z)</div>
                            <div id="req-low" class="text-danger"><i class="bi bi-x-circle me-1"></i> At least 1 lowercase letter (a-z)</div>
                            <div id="req-num" class="text-danger"><i class="bi bi-x-circle me-1"></i> At least 1 digit (0-9)</div>
                            <div id="req-spec" class="text-danger"><i class="bi bi-x-circle me-1"></i> At least 1 special symbol (!@#$%^&*)</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label small fw-semibold text-secondary">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-check2-circle"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm_password', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                            <i class="bi bi-check-lg me-1"></i> Update Password & Sign In
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, btn) {
    const field = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

function checkStrength(pwd) {
    const len = pwd.length >= 8;
    const up = /[A-Z]/.test(pwd);
    const low = /[a-z]/.test(pwd);
    const num = /[0-9]/.test(pwd);
    const spec = /[!@#$%^&*()_+=\-\[\]{}|;:,.<>?/]/.test(pwd);

    updateReq('req-len', len);
    updateReq('req-up', up);
    updateReq('req-low', low);
    updateReq('req-num', num);
    updateReq('req-spec', spec);

    const score = [len, up, low, num, spec].filter(Boolean).length;
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');

    if (score === 0) {
        bar.style.width = '0%';
        bar.className = 'progress-bar bg-danger';
        text.innerText = 'Password Strength: None';
    } else if (score < 3) {
        bar.style.width = '35%';
        bar.className = 'progress-bar bg-danger';
        text.innerText = 'Password Strength: Weak';
        text.className = 'small text-danger';
    } else if (score < 5) {
        bar.style.width = '70%';
        bar.className = 'progress-bar bg-warning';
        text.innerText = 'Password Strength: Moderate (needs all requirements)';
        text.className = 'small text-warning';
    } else {
        bar.style.width = '100%';
        bar.className = 'progress-bar bg-success';
        text.innerText = 'Password Strength: Strong & Secure!';
        text.className = 'small text-success fw-bold';
    }
}

function updateReq(elemId, isValid) {
    const el = document.getElementById(elemId);
    if (isValid) {
        el.className = 'text-success';
        el.querySelector('i').className = 'bi bi-check-circle-fill me-1';
    } else {
        el.className = 'text-danger';
        el.querySelector('i').className = 'bi bi-x-circle me-1';
    }
}
</script>

</body>
</html>
