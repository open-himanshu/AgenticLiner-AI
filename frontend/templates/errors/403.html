<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden - AgenticLiner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .error-card {
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="text-danger mb-3">
        <i class="bi bi-shield-lock-fill" style="font-size: 4rem;"></i>
    </div>
    <h3 class="fw-bold text-dark mb-2">403 - Access Forbidden</h3>
    <p class="text-muted small mb-4">
        {{ detail or 'Your account role does not have authorization to access this dashboard.' }}
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a href="/" class="btn btn-primary fw-semibold px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to My Dashboard
        </a>
        <a href="/logout" class="btn btn-outline-danger fw-semibold px-3">
            <i class="bi bi-box-arrow-right me-1"></i> Switch Account
        </a>
    </div>
</div>

</body>
</html>
